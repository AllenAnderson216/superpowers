name: Sync Fork

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间(UTC+8)每天 6:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }} --branch main
